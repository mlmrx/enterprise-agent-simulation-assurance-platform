name: daily-assurance-intelligence

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: easap-daily-intelligence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect primary-source intelligence and publish the daily brief
        run: node tools/publish-daily-intelligence.mjs
      - name: Verify generated content and platform build
        run: npm test
      - name: Commit verified daily content
        run: |
          if git diff --quiet -- content; then
            echo "No verified content change to publish."
            exit 0
          fi
          git config user.name "easap-source-desk"
          git config user.email "source-desk@users.noreply.github.com"
          git add content
          git commit -m "Publish daily agent assurance intelligence"
          git push
